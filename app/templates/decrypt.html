<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEURO-NET | DECRYPTOR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* THEME: CRYO-SECURITY (Cyan/Blue/White) */
            --neon-cyan: #00f3ff;
            --deep-blue: #001133;
            --ice-white: #e0f7fa;
            --glass-blue: rgba(0, 24, 50, 0.85);
            --border-cyan: rgba(0, 243, 255, 0.4);
            --alert-red: #ff3333;
        }

        body {
            background-color: #02040a;
            color: var(--ice-white);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* --- ANIMATED BACKGROUND --- */
        .circuit-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 17, 51, 0.9), rgba(0, 5, 10, 0.95)),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%2300f3ff' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            z-index: -2;
            animation: pulse-bg 10s infinite alternate;
        }

        .scan-line {
            position: fixed; top: 0; left: 0; width: 100%; height: 5px;
            background: rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 10px var(--neon-cyan);
            z-index: -1;
            animation: scanMove 4s linear infinite;
        }

        /* --- CONTAINER --- */
        .container-fluid {
            max-width: 900px; margin: 0 auto; padding: 40px 20px;
            position: relative; z-index: 10;
        }

        /* --- HEADER --- */
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--neon-cyan); padding-bottom: 20px; margin-bottom: 40px;
            animation: slideDown 0.8s ease-out;
        }
        .module-title {
            font-family: 'Orbitron'; font-size: 2.5rem; color: #fff;
            text-shadow: 0 0 20px var(--neon-cyan); letter-spacing: 5px;
        }
        .module-sub {
            font-family: 'JetBrains Mono'; color: var(--neon-cyan); font-size: 0.8rem;
            letter-spacing: 2px; text-transform: uppercase;
        }
        .back-btn {
            border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 20px;
            text-decoration: none; font-family: 'Orbitron'; font-size: 0.8rem; transition: 0.3s;
            background: rgba(0, 243, 255, 0.05);
        }
        .back-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }

        /* --- DECRYPTION INTERFACE --- */
        .crypto-panel {
            background: var(--glass-blue);
            border: 1px solid var(--border-cyan);
            border-radius: 5px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.1);
            padding: 40px;
            backdrop-filter: blur(5px);
            animation: fadeInUp 1s ease-out; /* ENTRY ANIMATION */
        }

        .input-label {
            display: flex; justify-content: space-between; color: var(--neon-cyan);
            font-family: 'Orbitron'; font-size: 0.9rem; margin-bottom: 10px;
        }
        
        .code-input {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #335577;
            color: var(--ice-white); padding: 15px; font-family: 'JetBrains Mono';
            font-size: 0.95rem; margin-bottom: 25px; transition: 0.3s;
            border-radius: 4px;
        }
        .code-input:focus {
            outline: none; border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            animation: pulse-border 2s infinite;
        }
        textarea.code-input { height: 120px; resize: none; }

        .btn-crack {
            width: 100%; background: transparent;
            border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
            padding: 18px; font-family: 'Orbitron'; font-weight: 900; letter-spacing: 3px;
            font-size: 1.2rem; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden;
            text-transform: uppercase;
        }
        .btn-crack::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4), transparent);
            transition: 0.5s;
        }
        .btn-crack:hover {
            background: var(--neon-cyan); color: #001133; box-shadow: 0 0 30px var(--neon-cyan);
        }
        .btn-crack:hover::before { left: 100%; animation: sweep 0.8s linear infinite; }

        /* --- OUTPUT DISPLAY --- */
        .output-console {
            margin-top: 30px; border: 1px solid #335577; background: #010205;
            padding: 20px; position: relative; min-height: 100px;
            font-family: 'JetBrains Mono';
            animation: consoleOpen 0.5s ease-out forwards;
            opacity: 0;
        }
        .console-header {
            position: absolute; top: -10px; left: 20px; background: #02040a;
            padding: 0 10px; color: #557799; font-size: 0.75rem; border: 1px solid #335577;
        }
        
        .success-msg { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
        .error-msg { color: var(--alert-red); text-shadow: 0 0 10px var(--alert-red); }
        
        /* DECORATIONS */
        .corner-bracket {
            position: absolute; width: 20px; height: 20px; border: 2px solid var(--neon-cyan);
            pointer-events: none; opacity: 0.7;
        }
        .tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        /* --- KEYFRAMES --- */
        @keyframes pulse-bg { 0% { opacity: 0.8; } 100% { opacity: 1; } }
        @keyframes scanMove { 0% { top: -10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 110%; opacity: 0; } }
        @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse-border { 0% { border-color: #335577; } 50% { border-color: var(--neon-cyan); } 100% { border-color: #335577; } }
        @keyframes sweep { 0% { left: -100%; } 100% { left: 100%; } }
        @keyframes consoleOpen { 0% { transform: scaleY(0); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            .header-bar { flex-direction: column; align-items: flex-start; gap: 15px; }
            .module-title { font-size: 1.8rem; letter-spacing: 2px; }
            .module-sub { font-size: 0.7rem; }
            .crypto-panel { padding: 20px; }
            .input-label { flex-direction: column; gap: 5px; font-size: 0.8rem; }
            .btn-crack { font-size: 1rem; padding: 15px; }
        }

    </style>
</head>
<body>

<div class="circuit-bg"></div>
<div class="scan-line"></div>

<div class="container-fluid">
    
    <div class="header-bar">
        <div>
            <div class="module-title">ICE_BREAKER</div>
            <div class="module-sub">/// CRYPTOGRAPHIC DECRYPTION PROTOCOL</div>
        </div>
        <a href="/architecture" class="back-btn">
            <i class="fas fa-chevron-left"></i> EXIT
        </a>
    </div>

    <div class="crypto-panel">
        <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
        <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>

        <form method="POST">
            <div class="input-label">
                <span><i class="fas fa-file-code"></i> ENCRYPTED PAYLOAD (HEX)</span>
                <span>TYPE: STRING</span>
            </div>
            <textarea name="text" class="code-input" placeholder="e.g. 48 65 6c 6c 6f..." required></textarea>

            <div class="input-label">
                <span><i class="fas fa-key"></i> PRIVATE KEY</span>
                <span>ALGO: XOR-CIPHER</span>
            </div>
            <input type="text" name="key" class="code-input" placeholder="Enter Key..." value="NEURO">

            <button type="submit" class="btn-crack">
                <i class="fas fa-unlock"></i> INITIATE DECRYPTION
            </button>
        </form>

        {% if result %}
        <div class="output-console">
            <div class="console-header">SYSTEM_OUTPUT</div>
            
            {% if status == 'success' %}
                <div class="success-msg">
                    <i class="fas fa-check-circle"></i> <strong>SUCCESS:</strong> VALID PAYLOAD RECOVERED<br><br>
                    <span style="color: #fff; font-size: 1.2rem; display: inline-block; animation: fadeInUp 0.5s 0.3s forwards; opacity: 0;">
                        "{{ result }}"
                    </span>
                </div>
            {% else %}
                <div class="error-msg">
                    <i class="fas fa-exclamation-triangle"></i> <strong>FAILURE:</strong> {{ result }}
                </div>
            {% endif %}
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
