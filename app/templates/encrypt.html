<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEURO-NET | ENCRYPTOR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020204; color: #fff; font-family: 'Rajdhani', sans-serif; overflow: hidden; height: 100vh; }
        
        /* MATRIX RAIN */
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.3; }

        .container { position: relative; z-index: 10; margin-top: 5vh; }

        .cyber-box {
            background: rgba(2, 2, 4, 0.85); border: 1px solid #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1); padding: 40px;
            backdrop-filter: blur(5px); animation: float 6s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .cyber-input {
            background: rgba(0, 243, 255, 0.05); border: 1px solid #00f3ff;
            color: #00f3ff; width: 100%; padding: 15px; margin-bottom: 20px;
            font-family: 'JetBrains Mono'; transition: 0.3s;
        }
        .cyber-input:focus { box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); outline: none; }

        .btn-cyber {
            background: #00f3ff; color: #000; font-weight: bold; width: 100%;
            padding: 12px; border: none; letter-spacing: 3px;
            transition: 0.3s; text-transform: uppercase;
        }
        .btn-cyber:hover { box-shadow: 0 0 30px #00f3ff; color: white; }

        /* ROTATING RING */
        .ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 600px; height: 600px; border: 2px dashed rgba(0, 243, 255, 0.2);
            border-radius: 50%; z-index: -1; animation: spin 20s linear infinite;
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .result-box { 
            word-break: break-all; border: 1px dashed #00f3ff; padding: 15px; 
            margin-top: 20px; color: #00f3ff; font-family: 'JetBrains Mono'; font-size: 0.8rem;
        }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            .ring { width: 100vw; height: 100vw; max-width: 400px; max-height: 400px; }
            .cyber-box { padding: 20px; width: 95%; margin: 0 auto; }
            h2 { font-size: 1.5rem; }
            .cyber-input { padding: 12px; font-size: 0.9rem; }
        }

    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="ring"></div>
    
    <div class="container d-flex justify-content-center">
        <div class="cyber-box" style="max-width: 600px; width: 100%;">
            <h2 class="text-center mb-4" style="color: #00f3ff; text-shadow: 0 0 10px #00f3ff;">/// DATA LOCKER</h2>
            
            <form method="POST">
                <label>SECURE PAYLOAD</label>
                <input type="text" name="text" class="cyber-input" placeholder="ENTER SENSITIVE DATA..." required autocomplete="off">
                <label>ENCRYPTION KEY</label>
                <input type="text" name="key" class="cyber-input" value="NEURO" required autocomplete="off">
                <button type="submit" class="btn-cyber">ENCRYPT STREAM</button>
            </form>

            {% if result %}
            <div class="result-box">
                <strong style="display:block; margin-bottom:5px;">[ OUTPUT HASH ]</strong>
                {{ result }}
            </div>
            {% endif %}
            
            <div class="text-center mt-4">
                <a href="/architecture" style="color: #444; text-decoration: none;">[ ABORT ]</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const chars = "0101010101XYNEURO"; 
        const drops = Array(Math.floor(canvas.width/20)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00f3ff"; ctx.font = "15px monospace";
            drops.forEach((y, i) => {
                const text = chars[Math.floor(Math.random()*chars.length)];
                ctx.fillText(text, i*20, y*20);
                if(y*20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 33);
    </script>
</body>
</html>
