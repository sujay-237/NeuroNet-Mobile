<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEURO-NET | SECURE VAULT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #050010; color: #fff; font-family: 'Rajdhani'; 
            min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
        }
        
        #neural-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.3;
        }

        .title { 
            font-family: 'Orbitron'; font-size: 3rem; color: #00ff9d; text-align: center; 
            margin-bottom: 20px; text-shadow: 0 0 20px #00ff9d; 
            animation: textGlow 2s infinite alternate;
        }

        .vault-container { 
            background: rgba(10, 0, 30, 0.85); border: 1px solid rgba(0, 255, 157, 0.5); 
            padding: 40px; width: 100%; max-width: 900px; margin: 20px; 
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.1); 
            position: relative; overflow: hidden;
            animation: boxPulse 4s infinite alternate;
            backdrop-filter: blur(10px);
        }

        .vault-container::after {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to bottom, transparent, rgba(0, 255, 157, 0.05), transparent);
            transform: translateY(-100%); animation: scanLine 6s infinite linear; pointer-events: none;
        }

        input { 
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #444; 
            padding: 15px; color: #fff; margin-bottom: 15px; font-family: 'Orbitron'; 
            transition: 0.3s;
        }
        input:focus { border-color: #00ff9d; box-shadow: 0 0 15px rgba(0, 255, 157, 0.4); outline: none; }
        
        button.btn-store { 
            width: 100%; background: #00ff9d; color: #000; border: none; padding: 15px; 
            font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button.btn-store:hover { background: #fff; box-shadow: 0 0 20px #00ff9d; transform: scale(1.02); }
        
        .vault-table { width: 100%; margin-top: 30px; border-collapse: separate; border-spacing: 0 10px; }
        .vault-table th, .vault-table td { padding: 15px; text-align: left; background: rgba(0,0,0,0.4); }
        .vault-table th { background: rgba(0, 255, 157, 0.2); font-family: 'Orbitron'; color: #00ff9d; }
        
        .vault-table tbody tr { transition: 0.3s; animation: floatRow 3s ease-in-out infinite alternate; }
        .vault-table tbody tr:hover { background: rgba(0, 255, 157, 0.1); transform: scale(1.01) !important; box-shadow: 0 0 15px rgba(0, 255, 157, 0.2); }
        
        @keyframes boxPulse { 0% { box-shadow: 0 0 20px rgba(0, 255, 157, 0.1); border-color: rgba(0, 255, 157, 0.3); } 100% { box-shadow: 0 0 50px rgba(0, 255, 157, 0.3); border-color: rgba(0, 255, 157, 0.8); } }
        @keyframes textGlow { 0% { text-shadow: 0 0 10px #00ff9d; } 100% { text-shadow: 0 0 30px #00ff9d, 0 0 40px #00ff9d; } }
        @keyframes floatRow { 0% { transform: translateY(0px); } 100% { transform: translateY(-3px); } }
        @keyframes scanLine { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            .title { font-size: 2rem; }
            .vault-container { padding: 20px; margin: 10px; width: 95%; }
            input, button.btn-store { padding: 12px; font-size: 1rem; }
            .vault-table { display: block; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
            .vault-table th, .vault-table td { padding: 10px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <canvas id="neural-canvas"></canvas>

    <div class="vault-container">
        <h1 class="title">ENCRYPTED VAULT</h1>
        
        {% if message %}
            <div style="text-align:center; color:#fff; background: rgba(0,255,157,0.2); padding: 10px; border: 1px solid #00ff9d; margin-bottom:20px; font-family:'Orbitron';">{{ message }}</div>
        {% endif %}

        <form method="POST">
            <input type="text" name="service" placeholder="Target Service (e.g. Server IP, Website)" required>
            <input type="text" name="username" placeholder="Username / ID" required>
            <input type="password" name="password" placeholder="Key / Password" required>
            <button type="submit" class="btn-store">STORE IN VAULT</button>
        </form>

        <table class="vault-table">
            <thead>
                <tr>
                    <th>SERVICE</th>
                    <th>USERNAME</th>
                    <th>ENCRYPTED PAYLOAD</th>
                </tr>
            </thead>
            <tbody>
                {% for item in vault_data %}
                <tr>
                    <td>{{ item.service }}</td>
                    <td>{{ item.username }}</td>
                    <td style="display: flex; align-items: center; justify-content: space-between;">
                        <span id="pwd-{{ loop.index }}" 
                              data-enc="{{ item.encrypted_password[:20] }}..." 
                              data-dec="{{ item.decrypted_password }}" 
                              style="color:#00ff9d; font-family:monospace; font-size:0.9rem; transition: 0.3s; word-break: break-all;">
                            {{ item.encrypted_password[:20] }}...
                        </span>
                        
                        <button type="button" 
                                onclick="togglePwd('pwd-{{ loop.index }}', this)" 
                                style="background: none; border: none; color: #aaa; width: auto; padding: 0; margin-left: 15px; cursor: pointer; box-shadow: none;">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <div style="text-align:center; margin-top: 30px;"><a href="/architecture" style="color: #aaa; text-decoration: none; font-family: 'Orbitron'; transition: 0.3s;">[ SYSTEM ARCHITECTURE ]</a></div>
    </div>

    <script>
        function togglePwd(spanId, btnElement) {
            const pwdSpan = document.getElementById(spanId);
            const icon = btnElement.querySelector('i');
            const encryptedText = pwdSpan.getAttribute('data-enc');
            const decryptedText = pwdSpan.getAttribute('data-dec');
            
            if (pwdSpan.innerText === encryptedText) {
                pwdSpan.innerText = decryptedText; pwdSpan.style.color = '#fff'; pwdSpan.style.textShadow = '0 0 10px #fff';
                icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); icon.style.color = '#ff0055';
            } else {
                pwdSpan.innerText = encryptedText; pwdSpan.style.color = '#00ff9d'; pwdSpan.style.textShadow = 'none';
                icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); icon.style.color = '#aaa';
            }
        }

        const canvas = document.getElementById('neural-canvas'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const particles = [];
        for(let i=0; i<60; i++) { particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.8, vy: (Math.random()-0.5)*0.8 }); }

        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = '#00ff9d';
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1; if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
                particles.forEach(p2 => {
                    const dx = p.x - p2.x; const dy = p.y - p2.y; const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 120) { ctx.beginPath(); ctx.strokeStyle = `rgba(0, 255, 157, ${1 - dist/120})`; ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
                });
            });
            requestAnimationFrame(animate);
        }
        animate(); window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
</html>
